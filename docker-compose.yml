services:
  mongo:
    image: mongo:8.0
    container_name: hustlehub-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - hustlehub-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hustlehub-backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/hustlehub
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      FRONTEND_ORIGINS: http://localhost:5173
      LOG_DIR: /app/logs
      BETTERSTACK_SOURCE_TOKEN: ${BETTERSTACK_SOURCE_TOKEN:-}
      BETTERSTACK_INGESTING_HOST: ${BETTERSTACK_INGESTING_HOST:-}
    ports:
      - "5000:5000"
    volumes:
      - backend_logs:/app/logs
    networks:
      - hustlehub-network
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('https').get({hostname:'localhost',port:5000,path:'/health',rejectUnauthorized:false},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: https://localhost:5000
    container_name: hustlehub-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"
    networks:
      - hustlehub-network

volumes:
  mongo_data:
    name: hustlehub_mongo_data
  backend_logs:
    name: hustlehub_backend_logs

networks:
  hustlehub-network:
    name: hustlehub_network
    driver: bridge
